name: Free iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create iOS Build Config
        run: flutter build ios --release --no-codesign --config-only

      - name: Install CocoaPods
        run: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update

      - name: Build iOS App Bundle
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload
          # -y preserves symlinks instead of dereferencing them. Runner.app/Frameworks
          # contains real macOS framework bundles (from CocoaPods' use_frameworks!),
          # which rely on internal symlinks (e.g. Versions/Current -> A). Plain
          # `zip -r` follows those symlinks and copies their targets in place instead,
          # corrupting the framework structure — SideStore/AltServer then can't parse
          # or resign the app and the install just silently does nothing.
          zip -qry PadelPro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: padel-pro-ios-unsigned
          path: PadelPro.ipa
